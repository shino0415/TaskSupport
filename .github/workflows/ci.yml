name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run ruff
        run: uv run ruff check .

  test:
    name: Test (pytest)
    needs: lint
    runs-on: ubuntu-latest
    env:
      # tests/はTestClient使用時に必要なAPI_KEYをmonkeypatchで各テスト自身が
      # 設定するため本来この環境変数への依存はないが、将来テストが増えた際の
      # 保険として、ローカル実行やCIでも同じ挙動になるよう明示しておく。
      API_KEY: ci-test-api-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run pytest
        run: uv run pytest

  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: project-tracker-api:ci
          build-args: |
            UV_VERSION=${{ env.UV_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
