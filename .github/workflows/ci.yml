name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run ruff
        run: uv run ruff check .

  test:
    name: Test (pytest)
    needs: lint
    runs-on: ubuntu-latest
    env:
      # backend/tests/はTestClient使用時に必要なAPI_KEYをmonkeypatchで各テスト自身が
      # 設定するため本来この環境変数への依存はないが、将来テストが増えた際の
      # 保険として、ローカル実行やCIでも同じ挙動になるよう明示しておく。
      API_KEY: ci-test-api-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run pytest
        run: uv run pytest

  migrate:
    name: Apply migrations (alembic upgrade head)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Apply migrations to a fresh database
        # 本番相当環境への実デプロイはこのパイプラインの対象外（CI/CDパイプライン構築タスク参照）のため、
        # ここではパイプライン実行のたびに、空のDBに対して現行の全マイグレーションが
        # 先頭から最新まで問題なく適用できることを検証する。適用に失敗した場合（alembicが
        # 非ゼロ終了する）はこのジョブが失敗し、needsで依存するbuildジョブに進ませない。
        env:
          DATABASE_URL: "sqlite:////tmp/ci_migration_check.db"
        run: uv run alembic -c backend/alembic.ini upgrade head

  build:
    name: Build Docker image
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: project-tracker-api:ci
          build-args: |
            UV_VERSION=${{ env.UV_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
